services:

  app:
    build: .

    ports:
      - "8000:8000"

    volumes:
      - .:/code

    depends_on:
      - db

  db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: fastapi_admin
      POSTGRES_PASSWORD: secure_pass_456
      POSTGRES_DB: fastapi_shop

      TZ: UTC
      PGTZ: UTC

    command: postgres -c timezone=UTC

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: