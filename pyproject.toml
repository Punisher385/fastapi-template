[project]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = [
    {name = "Vasukhnik",email = "Vasukhnik@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "fastapi_template", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
